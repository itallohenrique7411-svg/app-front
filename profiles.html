<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rede Social - Perfis</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #f0f2f5;
      padding: 40px 20px;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }
    h1 {
      color: #1a73e8;
      font-size: 28px;
    }
    .btn-create {
      padding: 10px 18px;
      background-color: #1a73e8;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      font-weight: bold;
    }
    .btn-create:hover {
      background-color: #1557b0;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
    }
    .profile-card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
      transition: transform 0.2s;
    }
    .profile-card:hover {
      transform: translateY(-4px);
    }
    .avatar {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 12px;
      border: 3px solid #1a73e8;
    }
    .name {
      font-size: 18px;
      font-weight: bold;
      color: #333;
    }
    .age {
      font-size: 14px;
      color: #666;
      margin-top: 4px;
    }
    .empty-message {
      text-align: center;
      color: #666;
      grid-column: 1 / -1;
      padding: 40px;
      background: white;
      border-radius: 12px;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Membros da Rede</h1>
      <a href="index.html" class="btn-create">+ Criar Novo Perfil</a>
    </header>

    <div id="profilesGrid" class="grid"></div>
  </div>

  <script src="./script.js"></script>
</body>
</html>
